name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: cargo check
        run: cargo check --features python
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1

  test:
    name: Python tests
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install maturin pytest pillow numpy

      - name: Generate test images
        run: python tests/generate_test_images.py

      - name: Build and install
        run: maturin develop --features python
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: 1

      - name: Run tests
        run: pytest tests/ -v
[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "png_parser"
version = "0.3.0"
description = "Hide any file inside PNG/BMP/TIFF/WebP — compress, encrypt, embed. Rust-powered."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Pranjal Panging" }]
keywords = ["steganography", "rust", "png", "encryption", "security", "wasm", "argon2"]
requires-python = ">=3.8"

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Security :: Cryptography",
    "Topic :: Multimedia :: Graphics",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/PranjalPanging/png-parser"
"Bug Tracker" = "https://github.com/PranjalPanging/png-parser/issues"
Repository = "https://github.com/PranjalPanging/png-parser.git"
Documentation = "https://github.com/PranjalPanging/png-parser#readme"
Changelog = "https://github.com/PranjalPanging/png-parser/releases"

[tool.maturin]
features = ["python"]
module-name = "png_parser"
binding = "pyo3"
python-source = "python"
strip = true